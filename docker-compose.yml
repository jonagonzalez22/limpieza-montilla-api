services:
    mysql:
        image: mysql:8.4
        container_name: limpieza-montilla-mysql
        restart: unless-stopped
        ports:
            - "3307:3306"
        environment:
            MYSQL_DATABASE: limpieza_montilla
            MYSQL_USER: montilla_local
            MYSQL_PASSWORD: montilla_local_password
            MYSQL_ROOT_PASSWORD: root_password
        volumes:
            - limpieza_montilla_mysql_data:/var/lib/mysql

volumes:
    limpieza_montilla_mysql_data:
